<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- to support multiple devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Design</title>
  </head>
  <body>
    <fieldset>
      <legend>Basic Form Controls</legend>
      <form>
        <!-- label and textbox for username -->
        <label>Username</label>
        <input type="text" />
        <br />
        <!-- label and passwordbox for password -->
        <label>Password</label>
        <input type="password" />
        <br />
        <!-- label and email box for email -->
        <label>Email</label>
        <input type="email" />
        <br />
        <!-- label and date control for birthdate -->
        <label>Birthdate</label>
        <input type="date" />
        <br />
        <!-- label and check box for Interests -->
        <label>Interests</label>
        <input type="checkbox" />Swimming <input type="checkbox" />Yoga
        <input type="checkbox" />Aerobics
        <br />
        <!-- label and radio button for Gender -->
        <label>Gender</label>
        <input type="radio" name="gender" />Male
        <input type="radio" name="gender" />Female
        <br />
        <!-- label and combo box for State -->
        <label>State</label>
        <select>
          <option>Select an option</option>
          <option>Penang</option>
          <option>Selangor</option>
          <option>Johor</option>
        </select>
        <br />
        <!-- label and textarea for Comments -->
        <label>Comments</label>
        <textarea>Enter comments here...</textarea>
        <br />
        <!-- Submit button -->
        <input type="submit" value="Register" />
        <!-- OR -->
        <button type="submit">Register</button>
        <br>
        <!-- Reset button -->
         <input type="reset" value="Clear">
         <!-- OR -->
          <button type="reset">Clear</button>
      </form>
    </fieldset>
  </body>
</html>
