<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline Style CSS</title>
</head>
<body>
    <!-- Inline Style  -->
     <!-- the style applies only to the current tag -->
    <h1 style="color:blue">Heading 1</h1>
    <h1 style="color:purple;font-family: Arial;">Another Heading</h1>
    <p style="color:brown;text-align: justify;">Lorem ipsum dolor sit, amet consectetur adipisicing elit. Laboriosam sapiente asperiores rem molestias temporibus molestiae odit eaque qui, sequi inventore ad quae non corporis, deleniti excepturi voluptate sit, ratione atque!</p>
</body>
</html>
